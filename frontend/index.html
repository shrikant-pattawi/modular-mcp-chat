<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular MCP Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold text-white tracking-wide">Modular MCP Chat</h1>
        </div>
        <span class="text-xs bg-gray-700 text-gray-300 px-3 py-1 rounded-full border border-gray-600">FastAPI + OpenAI + MCP</span>
    </header>

    <!-- Chat History Window -->
    <main id="chat-history" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-sm shadow">AI</div>
            <div class="bg-gray-800 border border-gray-700 text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-lg shadow-sm">
                Hello! I am your Modular MCP AI assistant. How can I help you today?
            </div>
        </div>
    </main>

    <!-- Typing Indicator (Hidden by default) -->
    <div id="loading-indicator" class="hidden max-w-4xl w-full mx-auto px-4 md:px-6 pb-2">
        <div class="flex items-center space-x-2 text-gray-400 text-sm">
            <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
            <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
            <span>AI is thinking & searching tools...</span>
        </div>
    </div>

    <!-- Input Box & Controls -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4 shadow-lg">
        <form id="chat-form" class="max-w-4xl mx-auto flex items-center space-x-3">
            <input 
                type="text" 
                id="message-input" 
                placeholder="Type your message..." 
                autocomplete="off"
                class="flex-1 bg-gray-900 text-gray-100 placeholder-gray-500 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            />
            <button 
                type="submit" 
                id="send-button"
                class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl shadow transition duration-200 flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <span>Send</span>
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
                </svg>
            </button>
        </form>
    </footer>

    <script src="js/chat_logic.js"></script>
</body>
</html>
